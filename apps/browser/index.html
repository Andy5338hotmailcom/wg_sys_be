<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Wildgoose Browser</title>
    <style>
        * {
            box-sizing: border-box;
            margin:0;
            padding:0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            height:100vh;
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }
        /* 标签栏 */
        #tabBar {
            display:flex;
            align-items:center;
            background:#ddd;
            padding:4px 4px 0;
            gap:4px;
        }
        .tab {
            position: relative;
            display: inline-flex;
            align-items: center;
            height: 32px;
            padding: 0 8px;
            background: #eee;
            border-radius:4px 4px 0 0;
            max-width: 180px;
            gap:6px;
            cursor:pointer;
        }
        .tab.active {
            background:#fff;
        }
        .tab-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex:1;
            font-size:13px;
        }
        .tab-close {
            border:none;
            background:transparent;
            cursor:pointer;
            width:20px;
            height:20px;
            border-radius:50%;
            font-size:16px;
            line-height:20px;
        }
        .tab-close:hover {
            background:#ddd;
        }
        .tab-new {
            width:32px;
            height:32px;
            border:none;
            background:#eee;
            border-radius:4px 4px 0 0;
            cursor:pointer;
            font-size:18px;
        }
        /* tooltip悬浮完整标题 */
        .tab:hover::after {
            content: attr(data-fulltitle);
            position: absolute;
            left: 4px;
            top: 36px;
            background: #222;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;
            font-size:12px;
            z-index:999;
            pointer-events:none;
        }

        /* 导航栏 */
        .nav-bar {
            display:flex;
            align-items:center;
            gap:6px;
            padding:6px 8px;
            background:#eee;
        }
        .nav-bar button {
            width:28px;
            height:28px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            background:#f4f4f4;
            transition: background 0.15s;
        }
        .nav-bar button:hover {
            background:#dddddd;
        }
        /* 顶部地址输入框 */
        #addr {
            flex:1;
            padding:7px 12px;
            border:1px solid #cccccc;
            border-radius:8px;
            font-size:14px;
            outline:none;
            transition: 0.2s ease;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
        }
        #addr:focus {
            border-color:#2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2), inset 0 1px 2px rgba(0,0,0,0.04);
        }
        .nav-bar .btn-action {
            padding:0 12px;
            width:auto;
            border-radius:8px;
            background:#e5e5e5;
        }
        .nav-bar .btn-action:hover {
            background:#d4d4d4;
        }

        /* iframe 内容区域 */
        #webview {
            flex:1;
            width:100%;
            border:none;
        }

        /* ========== 新建标签页 完全匹配截图样式 ========== */
        #newTabPage {
            flex:1;
            display:none;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            background:#ffffff;
            gap:32px;
        }
        #newTabPage h1 {
            font-size:48px;
            font-weight:normal;
            color:#111;
        }
        #newTabInput {
            width:65%;
            padding:16px 22px;
            border:1px solid #d1d1d1;
            border-radius:999px; /* 超大圆角，胶囊形 */
            font-size:18px;
            outline:none;
            transition:0.2s;
        }
        #newTabInput:focus {
            border-color:#2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }
    </style>
</head>
<body>
    <div id="tabBar">
        <button class="tab-new" onclick="newTab()">+</button>
    </div>
    <div class="nav-bar">
        <button onclick="goBack()">←</button>
        <button onclick="goForward()">→</button>
        <button onclick="reload()">⟳</button>
        <button onclick="goHome()">🏠</button>
        <input id="addr" placeholder="输入网址或者搜索词" onkeydown="if(event.key==='Enter')navigate()">
        <button class="btn-action" onclick="navigate()">前往</button>
        <button class="btn-action" onclick="newTab('wgbrowser:about')">关于</button>
    </div>

    <iframe id="webview"></iframe>

    <div id="newTabPage">
        <h1>Wildgoose 浏览器</h1>
        <input id="newTabInput" placeholder="搜索或输入网址" onkeydown="if(event.key==='Enter')navigateFromNewTab()">
    </div>

<script>
const iframe = document.getElementById("webview");
const addrInput = document.getElementById("addr");
const tabBar = document.getElementById("tabBar");
const newTabPage = document.getElementById("newTabPage");
const newTabInput = document.getElementById("newTabInput");

let tabs = [];
let activeTabId = null;
let tabIdCounter = 1;
const NEWTAB_SIGN = "wgbrowser:newtab";

function showNewTab() {
    iframe.style.display = "none";
    newTabPage.style.display = "flex";
}
function hideNewTab() {
    iframe.style.display = "block";
    newTabPage.style.display = "none";
}

// 更新标签显示标题
function updateTabTitle(tid, titleText) {
    const tab = tabs.find(t => t.id === tid);
    if (!tab) return;
    tab.titleText = titleText;
    renderTabs();
}

// 创建标签
function newTab(url = NEWTAB_SIGN) {
    const tid = tabIdCounter++;
    let iframeSrc = url;
    if(url === NEWTAB_SIGN) iframeSrc = "";
    const tabData = {
        id: tid,
        url: url,
        iframeSrc: iframeSrc,
        historyStack: [],
        historyIndex: -1,
        titleText: url
    };
    tabData.historyStack.push({url:url, iframeSrc:iframeSrc});
    tabData.historyIndex = 0;
    tabs.push(tabData);
    renderTabs();
    switchTab(tid);
    if(url !== NEWTAB_SIGN) {
        loadUrl(tid, url);
    }
}

// 渲染标签栏
function renderTabs(){
    const newTabBtn = tabBar.querySelector(".tab-new");
    tabBar.innerHTML = "";
    tabBar.appendChild(newTabBtn);
    tabs.forEach(tab=>{
        const div = document.createElement("div");
        div.className = "tab" + (tab.id === activeTabId ? " active" : "");
        div.onclick = (e)=>{
            if(!e.target.classList.contains("tab-close")) switchTab(tab.id);
        };
        div.innerHTML = `
            <span class="tab-title">${tab.titleText}</span>
            <button class="tab-close" onclick="closeTab(${tab.id})">×</button>
        `;
        div.setAttribute("data-fulltitle", tab.titleText);
        tabBar.insertBefore(div, newTabBtn);
    })
}

// 切换标签
function switchTab(tid){
    const tab = tabs.find(t=>t.id === tid);
    if(!tab) return;
    activeTabId = tid;
    addrInput.value = tab.url;
    if(tab.url === NEWTAB_SIGN){
        showNewTab();
        updateTabTitle(tid, "新建标签页");
    }else{
        hideNewTab();
        iframe.src = tab.iframeSrc;
        iframe.onload = function() {
            try {
                const pageTitle = iframe.contentDocument.title;
                if(pageTitle && pageTitle.trim() !== "") {
                    updateTabTitle(tid, pageTitle);
                } else {
                    updateTabTitle(tid, tab.url);
                }
            } catch(e) {
                updateTabTitle(tid, tab.url);
            }
        }
    }
    renderTabs();
}

// 关闭标签
function closeTab(tid){
    if(tabs.length <= 1) return;
    const idx = tabs.findIndex(t=>t.id===tid);
    tabs.splice(idx,1);
    if(activeTabId === tid){
        const newIdx = Math.max(0, idx - 1);
        const newActive = tabs[newIdx];
        activeTabId = newActive.id;
        switchTab(activeTabId);
    }
    renderTabs();
}

// 地址栏跳转
function navigate(){
    let rawUrl = addrInput.value.trim();
    if(!rawUrl) return;
    loadUrl(activeTabId, rawUrl);
}
function navigateFromNewTab(){
    const rawUrl = newTabInput.value.trim();
    if(!rawUrl) return;
    loadUrl(activeTabId, rawUrl);
    newTabInput.value = "";
}

function loadUrl(tid, rawUrl){
    const tab = tabs.find(t=>t.id === tid);
    if(!tab) return;
    let displayUrl = rawUrl;
    let iframeSrc = rawUrl;

    // 自定义协议解析
    if(rawUrl.startsWith("wgbrowser:")){
        const cmd = rawUrl.replace("wgbrowser:","").toLowerCase();
        if(cmd === "newtab"){
            newTab(NEWTAB_SIGN);
            return;
        }
        if(cmd === "about"){
            displayUrl = "wgbrowser:about";
            iframeSrc = "./about.html";
        }
    }
    if(rawUrl.startsWith("wgbrowserfiles:")){
        displayUrl = rawUrl;
        const filePath = rawUrl.replace("wgbrowserfiles:","");
        iframeSrc = "./" + filePath;
    }

    if(displayUrl === NEWTAB_SIGN){
        tab.historyStack.splice(tab.historyIndex+1);
        tab.historyStack.push({url:displayUrl, iframeSrc:""});
        tab.historyIndex = tab.historyStack.length -1;
        tab.url = displayUrl;
        tab.iframeSrc = "";
        addrInput.value = tab.url;
        showNewTab();
        updateTabTitle(tid, "新建标签页");
        renderTabs();
        return;
    }

    // 自定义协议，跳过搜索
    if(rawUrl.startsWith("wgbrowser:") || rawUrl.startsWith("wgbrowserfiles:")){
        tab.historyStack.splice(tab.historyIndex+1);
        tab.historyStack.push({url:displayUrl, iframeSrc:iframeSrc});
        tab.historyIndex = tab.historyStack.length -1;
        tab.url = displayUrl;
        tab.iframeSrc = iframeSrc;
        addrInput.value = tab.url;
        hideNewTab();
        iframe.src = iframeSrc;
        if(rawUrl === "wgbrowser:about") {
            updateTabTitle(tid, "Wildgoose Browser - 关于");
        }
        renderTabs();
        return;
    }

    // 普通网址 / Bing搜索
    const isUrl = /^(https?:\/\/)|(\.[a-zA-Z0-9-]+\.[a-zA-Z]{2,})/.test(rawUrl);
    if(!isUrl){
        iframeSrc = "https://www.bing.com/search?q=" + encodeURIComponent(rawUrl);
    }else if(!/^https?:\/\//.test(rawUrl)){
        iframeSrc = "https://"+rawUrl;
    }
    displayUrl = rawUrl;

    tab.historyStack.splice(tab.historyIndex+1);
    tab.historyStack.push({url:displayUrl, iframeSrc:iframeSrc});
    tab.historyIndex = tab.historyStack.length -1;
    tab.url = displayUrl;
    tab.iframeSrc = iframeSrc;
    addrInput.value = tab.url;
    hideNewTab();
    iframe.src = iframeSrc;
    renderTabs();
}

function goBack(){
    const tab = tabs.find(t=>t.id === activeTabId);
    if(!tab || tab.historyIndex <= 0) return;
    tab.historyIndex --;
    const entry = tab.historyStack[tab.historyIndex];
    tab.url = entry.url;
    tab.iframeSrc = entry.iframeSrc;
    addrInput.value = tab.url;
    hideNewTab();
    iframe.src = tab.iframeSrc;
    renderTabs();
}
function goForward(){
    const tab = tabs.find(t=>t.id === activeTabId);
    if(!tab || tab.historyIndex >= tab.historyStack.length-1) return;
    tab.historyIndex ++;
    const entry = tab.historyStack[tab.historyIndex];
    tab.url = entry.url;
    tab.iframeSrc = entry.iframeSrc;
    addrInput.value = tab.url;
    hideNewTab();
    iframe.src = iframeSrc;
    renderTabs();
}
function reload(){
    const tab = tabs.find(t=>t.id === activeTabId);
    if(!tab || tab.url === NEWTAB_SIGN) return;
    iframe.src = tab.iframeSrc;
}
function goHome(){
    loadUrl(activeTabId, NEWTAB_SIGN);
}

// 初始化
newTab(NEWTAB_SIGN);
</script>
</body>
</html>
