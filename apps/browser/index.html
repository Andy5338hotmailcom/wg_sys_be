<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>浏览器</title>
<style>
* {
    box-sizing: border-box;
    margin:0;
    padding:0;
    font-family: system-ui,sans-serif;
}
body{
    background:var(--wg-bg,#fff);
    color:var(--wg-text,#111);
    height:100vh;
    display:flex;
    flex-direction:column;
}
/* 标签栏 */
.tabbar{
    display:flex;
    gap:4px;
    padding:6px 8px;
    background:var(--wg-tab-bg,#e9e9e9);
    overflow-x:auto;
    align-items:center;
}
.tab{
    display:flex;
    align-items:center;
    gap:6px;
    padding:5px 10px;
    border-radius:6px 6px 0 0;
    background:var(--wg-tab,#ddd);
    min-width:120px;
    max-width:180px;
    cursor:pointer;
}
.tab.active{
    background:var(--wg-bg,#fff);
}
.tab-title{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1;
    font-size:0.85rem;
}
.tab-close{
    width:18px;
    height:18px;
    border-radius:99px;
    border:none;
    background:#bbb;
    color:#000;
    cursor:pointer;
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:center;
}
.tab-new{
    width:30px;
    height:30px;
    border-radius:6px;
    border:none;
    background:var(--wg-btn,#ddd);
    cursor:pointer;
    font-size:18px;
    flex-shrink:0;
}
.topbar{
    display:flex;
    gap:6px;
    padding:8px;
    align-items:center;
}
button{
    border:none;
    border-radius:6px;
    padding:6px 10px;
    cursor:pointer;
    background:var(--wg-btn,#eee);
    color:inherit;
}
#addr{
    flex:1;
    padding:7px 10px;
    border:1px solid var(--wg-border,#ccc);
    border-radius:6px;
    background:var(--wg-input-bg,#fff);
    color:inherit;
}
#frameWrap{
    flex:1;
    width:100%;
    position:relative;
}
#webview{
    width:100%;
    height:100%;
    border:none;
}
.newtab{
    position:absolute;
    inset:0;
    background:var(--wg-bg,#fff);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:24px;
}
.newtab-search{
    width: min(600px,90%);
}
.newtab-search input{
    width:100%;
    padding:14px 18px;
    border-radius:999px;
    border:1px solid #ccc;
    font-size:1rem;
    background:var(--wg-input-bg,#fff);
    color:inherit;
}
</style>
</head>
<body>
<div class="tabbar" id="tabBar">
    <button class="tab-new" onclick="newTab()">+</button>
</div>

<div class="topbar">
    <button onclick="goBack()">←</button>
    <button onclick="goForward()">→</button>
    <button onclick="reload()">⟳</button>
    <button onclick="goHome()">🏠</button>
    <input id="addr" placeholder="输入网址，按回车访问" onkeydown="if(event.key==='Enter')navigate()">
    <button onclick="navigate()">前往</button>
</div>

<div id="frameWrap">
    <iframe id="webview" src="about:blank"></iframe>
    <div class="newtab" id="newTabPage">
        <h2>Wildgoose 浏览器</h2>
        <div class="newtab-search">
            <input id="newTabInput" placeholder="搜索或输入网址" onkeydown="if(event.key==='Enter')navigateFromNewTab()">
        </div>
    </div>
</div>

<script>
const iframe = document.getElementById("webview");
const addrInput = document.getElementById("addr");
const tabBar = document.getElementById("tabBar");
const newTabPage = document.getElementById("newTabPage");
const newTabInput = document.getElementById("newTabInput");

let tabs = [];
let activeTabId = null;
let tabIdCounter = 1;
const NEWTAB_SIGN = "about:newtab";

function showNewTab() {
    iframe.style.display = "none";
    newTabPage.style.display = "flex";
}
function hideNewTab() {
    iframe.style.display = "block";
    newTabPage.style.display = "none";
}

// 创建标签
function newTab(url = NEWTAB_SIGN) {
    const tid = tabIdCounter++;
    const tabData = {
        id: tid,
        title: "新标签页",
        url: url,
        historyStack: [],
        historyIndex: -1
    };
    tabData.historyStack.push(url);
    tabData.historyIndex = 0;
    tabs.push(tabData);
    renderTabs();
    switchTab(tid);
}

function renderTabs(){
    const newTabBtn = tabBar.querySelector(".tab-new");
    tabBar.innerHTML = "";
    tabBar.appendChild(newTabBtn);
    tabs.forEach(tab=>{
        const div = document.createElement("div");
        div.className = "tab" + (tab.id === activeTabId ? " active" : "");
        div.onclick = (e)=>{
            if(!e.target.classList.contains("tab-close")) switchTab(tab.id);
        };
        div.innerHTML = `
            <span class="tab-title">${tab.title}</span>
            <button class="tab-close" onclick="closeTab(${tab.id})">×</button>
        `;
        tabBar.insertBefore(div, newTabBtn);
    })
}

function switchTab(tid){
    const tab = tabs.find(t=>t.id === tid);
    if(!tab) return;
    activeTabId = tid;
    addrInput.value = tab.url;
    if(tab.url === NEWTAB_SIGN){
        showNewTab();
    }else{
        hideNewTab();
        iframe.src = tab.url;
    }
    renderTabs();
}

function closeTab(tid){
    if(tabs.length <= 1) return;
    const idx = tabs.findIndex(t=>t.id===tid);
    tabs.splice(idx,1);
    if(activeTabId === tid){
        const newActive = tabs[Math.max(0, idx-1)];
        activeTabId = newActive.id;
        switchTab(activeTabId);
    }else{
        renderTabs();
    }
}

// 由外层地址栏发起导航（唯一更新tab.url的入口）
function navigate(){
    let url = addrInput.value.trim();
    if(!url) return;
    loadUrl(activeTabId, url);
}
function navigateFromNewTab(){
    const url = newTabInput.value.trim();
    if(!url) return;
    loadUrl(activeTabId, url);
    newTabInput.value = "";
}

function loadUrl(tid, rawUrl){
    const tab = tabs.find(t=>t.id === tid);
    if(!tab) return;
    let url = rawUrl.trim();

    // 判断输入是否为网址
    const isUrl = /^(https?:\/\/)|(\.[a-zA-Z0-9-]+\.[a-zA-Z]{2,})/.test(url);

    if(url !== NEWTAB_SIGN && !isUrl){
        // 不是网址，使用Bing搜索引擎
        url = "https://www.bing.com/search?q=" + encodeURIComponent(rawUrl);
    }else if(url !== NEWTAB_SIGN && !/^https?:\/\//.test(url)){
        url = "https://"+url;
    }

    tab.historyStack.splice(tab.historyIndex+1);
    tab.historyStack.push(url);
    tab.historyIndex = tab.historyStack.length -1;
    tab.url = url;
    tab.title = url;
    addrInput.value = url;
    if(url === NEWTAB_SIGN){
        showNewTab();
    }else{
        hideNewTab();
        iframe.src = url;
    }
    renderTabs();
}

function goBack(){
    const tab = tabs.find(t=>t.id === activeTabId);
    if(!tab || tab.historyIndex <= 0) return;
    tab.historyIndex--;
    const url = tab.historyStack[tab.historyIndex];
    tab.url = url;
    addrInput.value = url;
    if(url === NEWTAB_SIGN) showNewTab();
    else {hideNewTab(); iframe.src = url;}
    renderTabs();
}
function goForward(){
    const tab = tabs.find(t=>t.id === activeTabId);
    if(!tab || tab.historyIndex >= tab.historyStack.length-1) return;
    tab.historyIndex++;
    const url = tab.historyStack[tab.historyIndex];
    tab.url = url;
    addrInput.value = url;
    if(url === NEWTAB_SIGN) showNewTab();
    else {hideNewTab(); iframe.src = url;}
    renderTabs();
}
function reload(){
    const tab = tabs.find(t=>t.id === activeTabId);
    if(!tab || tab.url === NEWTAB_SIGN) return;
    iframe.src = tab.url;
}
function goHome(){
    loadUrl(activeTabId, NEWTAB_SIGN);
}

// 初始化
newTab(NEWTAB_SIGN);
</script>
</body>
</html>
