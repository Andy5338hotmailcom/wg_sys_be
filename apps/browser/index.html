<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>浏览器</title>
<style>
* {
    box-sizing: border-box;
    margin:0;
    padding:0;
    font-family: system-ui,sans-serif;
}
body{
    background:var(--wg-bg,#fff);
    color:var(--wg-text,#111);
    height:100vh;
    display:flex;
    flex-direction:column;
}
/* 标签栏 */
.tabbar{
    display:flex;
    gap:4px;
    padding:6px 8px;
    background:var(--wg-tab-bg,#e9e9e9);
    overflow-x:auto;
    align-items:center;
}
.tab{
    display:flex;
    align-items:center;
    gap:6px;
    padding:5px 10px;
    border-radius:6px 6px 0 0;
    background:var(--wg-tab,#ddd);
    min-width:120px;
    max-width:180px;
    cursor:pointer;
}
.tab.active{
    background:var(--wg-bg,#fff);
}
.tab-title{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1;
    font-size:0.85rem;
}
.tab-close{
    width:18px;
    height:18px;
    border-radius:99px;
    border:none;
    background:#bbb;
    color:#000;
    cursor:pointer;
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:center;
}
.tab-new{
    width:30px;
    height:30px;
    border-radius:6px;
    border:none;
    background:var(--wg-btn,#ddd);
    cursor:pointer;
    font-size:18px;
    flex-shrink:0;
}
.topbar{
    display:flex;
    gap:6px;
    padding:8px;
    align-items:center;
}
button{
    border:none;
    border-radius:6px;
    padding:6px 10px;
    cursor:pointer;
    background:var(--wg-btn,#eee);
    color:inherit;
}
#addr{
    flex:1;
    padding:7px 10px;
    border:1px solid var(--wg-border,#ccc);
    border-radius:6px;
    background:var(--wg-input-bg,#fff);
    color:inherit;
}
#frameWrap{
    flex:1;
    width:100%;
}
#webview{
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>
<body>
<!-- 标签栏 -->
<div class="tabbar" id="tabBar">
    <button class="tab-new" onclick="newTab()">+</button>
</div>

<!-- 导航工具栏 -->
<div class="topbar">
    <button onclick="goBack()">←</button>
    <button onclick="goForward()">→</button>
    <button onclick="reload()">⟳</button>
    <button onclick="goHome()">🏠</button>
    <input id="addr" placeholder="输入网址" onkeydown="if(event.key==='Enter')navigate()">
    <button onclick="navigate()">前往</button>
</div>

<div id="frameWrap">
    <iframe id="webview" src="about:blank"></iframe>
</div>

<script>
const iframe = document.getElementById("webview");
const addrInput = document.getElementById("addr");
const tabBar = document.getElementById("tabBar");
const homeUrl = "https://www.baidu.com";

// 标签数据
let tabs = [];
let activeTabId = null;
let tabIdCounter = 1;

// 创建新标签
function newTab(url = homeUrl) {
    const tid = tabIdCounter++;
    const tabData = {
        id: tid,
        title: "新标签页",
        url: url,
        historyStack: [],
        historyIndex: -1
    };
    tabData.historyStack.push(url);
    tabData.historyIndex = 0;
    tabs.push(tabData);
    renderTabs();
    switchTab(tid);
}

// 渲染全部标签DOM
function renderTabs(){
    // 清空，保留新建按钮
    const newTabBtn = tabBar.querySelector(".tab-new");
    tabBar.innerHTML = "";
    tabBar.appendChild(newTabBtn);

    tabs.forEach(tab=>{
        const div = document.createElement("div");
        div.className = "tab" + (tab.id === activeTabId ? " active" : "");
        div.onclick = (e)=>{
            if(!e.target.classList.contains("tab-close")) switchTab(tab.id);
        };
        div.innerHTML = `
            <span class="tab-title">${tab.title}</span>
            <button class="tab-close" onclick="closeTab(${tab.id})">×</button>
        `;
        tabBar.insertBefore(div, newTabBtn);
    })
}

// 切换标签
function switchTab(tid){
    const tab = tabs.find(t=>t.id === tid);
    if(!tab) return;
    activeTabId = tid;
    iframe.src = tab.url;
    addrInput.value = tab.url;
    renderTabs();
}

// 关闭标签
function closeTab(tid){
    if(tabs.length <= 1) return; // 保留至少一个标签
    const idx = tabs.findIndex(t=>t.id===tid);
    tabs.splice(idx,1);
    if(activeTabId === tid){
        // 关闭当前标签，切换到前一个
        const newActive = tabs[Math.max(0, idx-1)];
        activeTabId = newActive.id;
        switchTab(activeTabId);
    }
    renderTabs();
}

// 导航（当前激活标签）
function navigate(){
    let url = addrInput.value.trim();
    if(!url) return;
    if(!/^https?:\/\//.test(url)){
        url = "https://"+url;
    }
    const tab = tabs.find(t=>t.id === activeTabId);
    tab.historyStack.splice(tab.historyIndex+1);
    tab.historyStack.push(url);
    tab.historyIndex = tab.historyStack.length -1;
    tab.url = url;
    tab.title = url;
    iframe.src = url;
    renderTabs();
}
function goBack(){
    const tab = tabs.find(t=>t.id === activeTabId);
    if(tab.historyIndex>0){
        tab.historyIndex--;
        tab.url = tab.historyStack[tab.historyIndex];
        iframe.src = tab.url;
        addrInput.value = tab.url;
        renderTabs();
    }
}
function goForward(){
    const tab = tabs.find(t=>t.id === activeTabId);
    if(tab.historyIndex < tab.historyStack.length-1){
        tab.historyIndex++;
        tab.url = tab.historyStack[tab.historyIndex];
        iframe.src = tab.url;
        addrInput.value = tab.url;
        renderTabs();
    }
}
function reload(){
    iframe.src = iframe.src;
}
function goHome(){
    addrInput.value = homeUrl;
    navigate();
}

// 初始化默认标签
newTab(homeUrl);
</script>
</body>
</html>
